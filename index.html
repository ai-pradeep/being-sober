<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0e1a" />
    <title>/: Being Sober :/</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/sober.svg" />
  </head>
  <body class="min-h-screen flex items-center justify-center p-4">
    <div class="ambient-glow ambient-glow--a"></div>
    <div class="ambient-glow ambient-glow--b"></div>
    <div class="ambient-glow ambient-glow--c"></div>

    <div class="timer-box w-full max-w-5xl rounded-3xl p-8 md:p-12 fade-in">
      <!-- Header -->
      <h1 class="title-text text-3xl md:text-5xl font-extrabold text-center mb-2">/: Being Sober :/</h1>
      <p class="text-center text-slate-400 mb-10 uppercase tracking-[0.3em] text-xs md:text-sm">for Being Sober</p>

      <!-- Timer Display -->
      <div class="max-w-6xl mx-auto">
        <div class="flex flex-wrap justify-center gap-5 md:gap-6">
          <!-- Years -->
          <div class="time-unit time-unit--years">
            <div class="progress-ring years-progress" style="--years-progress: 0%"></div>
            <div class="inner-circle"></div>
            <div class="flip-unit" data-flip="years">
              <div class="flip-static flip-static--upper"><span class="time-value">00</span></div>
              <div class="flip-static flip-static--lower"><span class="time-value">00</span></div>
              <div class="flip-anim flip-anim--a idle"><span class="time-value">00</span></div>
              <div class="flip-anim flip-anim--b idle"><span class="time-value">00</span></div>
            </div>
            <div class="time-label uppercase tracking-wider">Years</div>
          </div>

          <!-- Months -->
          <div class="time-unit time-unit--months">
            <div class="progress-ring months-progress" style="--months-progress: 0%"></div>
            <div class="inner-circle"></div>
            <div class="flip-unit" data-flip="months">
              <div class="flip-static flip-static--upper"><span class="time-value">00</span></div>
              <div class="flip-static flip-static--lower"><span class="time-value">00</span></div>
              <div class="flip-anim flip-anim--a idle"><span class="time-value">00</span></div>
              <div class="flip-anim flip-anim--b idle"><span class="time-value">00</span></div>
            </div>
            <div class="time-label uppercase tracking-wider">Months</div>
          </div>

          <!-- Days -->
          <div class="time-unit time-unit--days">
            <div class="progress-ring days-progress" style="--days-progress: 0%"></div>
            <div class="inner-circle"></div>
            <div class="flip-unit" data-flip="days">
              <div class="flip-static flip-static--upper"><span class="time-value">00</span></div>
              <div class="flip-static flip-static--lower"><span class="time-value">00</span></div>
              <div class="flip-anim flip-anim--a idle"><span class="time-value">00</span></div>
              <div class="flip-anim flip-anim--b idle"><span class="time-value">00</span></div>
            </div>
            <div class="time-label uppercase tracking-wider">Days</div>
          </div>

          <!-- Hours -->
          <div class="time-unit time-unit--hours">
            <div class="progress-ring hours-progress" style="--hours-progress: 0%"></div>
            <div class="inner-circle"></div>
            <div class="flip-unit" data-flip="hours">
              <div class="flip-static flip-static--upper"><span class="time-value">00</span></div>
              <div class="flip-static flip-static--lower"><span class="time-value">00</span></div>
              <div class="flip-anim flip-anim--a idle"><span class="time-value">00</span></div>
              <div class="flip-anim flip-anim--b idle"><span class="time-value">00</span></div>
            </div>
            <div class="time-label uppercase tracking-wider">Hours</div>
          </div>

          <!-- Minutes -->
          <div class="time-unit time-unit--minutes">
            <div class="progress-ring minutes-progress" style="--minutes-progress: 0%"></div>
            <div class="inner-circle"></div>
            <div class="flip-unit" data-flip="minutes">
              <div class="flip-static flip-static--upper"><span class="time-value">00</span></div>
              <div class="flip-static flip-static--lower"><span class="time-value">00</span></div>
              <div class="flip-anim flip-anim--a idle"><span class="time-value">00</span></div>
              <div class="flip-anim flip-anim--b idle"><span class="time-value">00</span></div>
            </div>
            <div class="time-label uppercase tracking-wider">Minutes</div>
          </div>

          <!-- Seconds -->
          <div class="time-unit time-unit--seconds">
            <div class="progress-ring seconds-progress" style="--seconds-progress: 0%"></div>
            <div class="inner-circle"></div>
            <div class="flip-unit" data-flip="seconds">
              <div class="flip-static flip-static--upper"><span class="time-value">00</span></div>
              <div class="flip-static flip-static--lower"><span class="time-value">00</span></div>
              <div class="flip-anim flip-anim--a idle"><span class="time-value">00</span></div>
              <div class="flip-anim flip-anim--b idle"><span class="time-value">00</span></div>
            </div>
            <div class="time-label uppercase tracking-wider">Seconds</div>
          </div>
        </div>
      </div>

      <!-- Reference Date Display -->
      <div class="mt-12 text-center">
        <div class="since-box inline-block rounded-2xl px-7 py-4">
          <p class="text-slate-400 text-xs uppercase tracking-[0.3em] mb-1">s!nc3</p>
          <p class="text-white font-medium" id="referenceDate">January 1, 2023 00:00:00</p>
        </div>
      </div>

      <!-- Footer -->
      <div class="mt-10 text-center text-slate-500 text-sm">
        <p>@deepkt</p>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
